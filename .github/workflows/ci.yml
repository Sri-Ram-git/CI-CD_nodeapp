name: Enterprise CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DOCKER_IMAGE: mrsridoc/node-ci-app
  DEPLOY_TAG: ${{ github.sha }}
  NODE_VERSION: "18"

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm test
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Image Tags
        id: meta
        run: |
          VERSION="1.0.0"
          echo "tags=${{ env.DOCKER_IMAGE }}:${{ env.DEPLOY_TAG }},${{ env.DOCKER_IMAGE }}:latest,${{ env.DOCKER_IMAGE }}:v$VERSION" >> $GITHUB_OUTPUT
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:${{ env.DEPLOY_TAG }}"
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        id: deploy
        continue-on-error: true
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DOCKER_IMAGE,DEPLOY_TAG
          script: |
            export DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}
            export DEPLOY_TAG=${{ env.DEPLOY_TAG }}
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

      - name: Verify Deployment Health
        if: steps.deploy.outcome == 'success'
        run: |
          echo "Deployment completed successfully"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ env.DEPLOY_TAG }}"

  rollback:
    name: Automatic Rollback
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    steps:
      - uses: actions/checkout@v4

      - name: Get Previous Stable Tag
        id: previous
        run: |
          PREV=$(curl -s "https://hub.docker.com/v2/repositories/${{ env.DOCKER_IMAGE }}/tags/?page_size=2" | \
            jq -r '.results[1].name // "latest"')
          echo "tag=$PREV" >> $GITHUB_OUTPUT

      - name: Execute Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DOCKER_IMAGE,PREVIOUS_TAG
          script: |
            export DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}
            export PREVIOUS_TAG=${{ steps.previous.outputs.tag }}
            chmod +x scripts/rollback.sh
            ./scripts/rollback.sh

  notify:
    name: Notification
    runs-on: ubuntu-latest
    if: always()
    needs: [deploy, rollback]
    steps:
      - name: Notify Success
        if: needs.deploy.result == 'success'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "Deployment Successful: ${{ env.DOCKER_IMAGE }}:${{ env.DEPLOY_TAG }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Rollback
        if: needs.rollback.result == 'success'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "Rollback Complete: ${{ env.DOCKER_IMAGE }} reverted to previous stable tag"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "Pipeline Failed for ${{ env.DOCKER_IMAGE }}:${{ env.DEPLOY_TAG }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
